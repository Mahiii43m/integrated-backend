  <circle cx="450" cy="450" r="92" fill="#0F2238"/>
  <path d="M450 360 L472 428 L540 450 L472 472 L450 540 L428 472 L360 450 L428 428 Z" fill="#DD984B"/>
  <circle cx="450" cy="450" r="18" fill="#FFFFFF"/>

